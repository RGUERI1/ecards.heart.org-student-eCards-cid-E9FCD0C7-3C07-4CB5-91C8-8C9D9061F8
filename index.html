<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student eCards</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }

        header {
            background-color: #0073aa;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .form-group button {
            background-color: #0073aa;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .form-group button:hover {
            background-color: #005f8d;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: #0073aa;
            color: #fff;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>
    <header>
        <h1>Student eCards Verification</h1>
    </header>
    <div class="container">
        <form>
            <div class="form-group">
                <label for="studentName">Student Name</label>
                <input type="text" id="studentName" placeholder="Enter student name" />
            </div>
            <div class="form-group">
                <label for="ecardCode">eCard Code</label>
                <input type="text" id="ecardCode" placeholder="Enter eCard code" />
            </div>
            <div class="form-group">
                <button type="submit">Verify</button>
            </div>
        </form>
        <p>
            For questions, please contact <strong>Rustin Guerin</strong> at <a href="mailto:rustin.guerin@example.com">rustin.guerin@example.com</a>.
        </p>
    </div>
    <footer>
        &copy; 2025 Heart eCards Portal
    </footer>
</body>

</html>
